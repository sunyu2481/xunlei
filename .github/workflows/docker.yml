name: 构建并发布镜像

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 普通权限验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # 真实挂载、跨设备和网络队列测试仅在独立测试环境中显式启用。
    env:
      XL_TEST_MOUNT: "0"
      XL_TEST_CROSS_DEVICE_DIR: ""
      XL_NETLIMIT_TEST_TARGET: ""
      XL_NETLIMIT_TEST_TARGET_V6: ""
    outputs:
      artifact-id: ${{ steps.binaries.outputs.artifact-id }}
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 配置 Go 环境
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: 确认普通用户并生成嵌入认证程序
        run: |
          test "$(id -u)" -ne 0
          make -C cmd/authenticate_cgi_go build

      - name: 运行普通权限测试
        run: go test -count=1 -timeout=5m ./...

      - name: 静态检查两种架构
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go vet ./...
          done

      - name: 检查已知漏洞
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: 编译两种架构的程序
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          mkdir -p artifacts
          for arch in amd64 arm64; do
            GOARCH="$arch" go build \
              -ldflags="-s -w -X main.BuildTime=${build_time}" \
              -trimpath -o "artifacts/xlp-${arch}" ./cmd/xlp
          done

      - name: 保存验证后的程序
        id: binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xlp-linux
          path: |
            artifacts/xlp-amd64
            artifacts/xlp-arm64
          if-no-files-found: error
          retention-days: 1

  docker:
    name: 发布镜像
    needs: verify
    if: ${{ needs.verify.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 下载本次验证生成的程序
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: artifacts
          merge-multiple: true

      - name: 检查程序并恢复执行权限
        run: |
          test -s artifacts/xlp-amd64
          test -s artifacts/xlp-arm64
          chmod 0755 artifacts/xlp-amd64 artifacts/xlp-arm64

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: amd64,arm64

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置镜像标签和元数据
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: latest=false

      - name: 构建并推送镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
