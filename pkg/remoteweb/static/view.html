<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迅雷 · 远程下载</title>
  <link rel="stylesheet" href="/remote/style.css">
  <script src="/remote/app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v12H3zm0 0V4h7l2 2h9v2"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 8 3-3a5 5 0 0 1 7 7l-3 3m-3 1-3 3a5 5 0 0 1-7-7l3-3m1 7 8-8"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 0 6M20 3v6h-6"/></symbol>
  </svg>
  <main>
    <header class="toolbar">
      <button class="icon-button" id="panel-back" aria-label="返回原页签" title="返回原页签">‹</button>
      <h1 class="page-title">远程下载</h1>
      <button class="primary" id="new-button"><span class="plus">＋</span> 新建下载</button>
      <button class="icon-button" id="refresh-button" aria-label="刷新任务" title="刷新任务"><svg><use href="#i-refresh"/></svg></button>
      <div class="account-summary"><span id="account-name">未登录迅雷账号</span><button class="small" id="account-button">登录迅雷</button></div>
    </header>
    <div class="device-toolbar">
      <button class="device-summary" id="device-summary"><svg><use href="#i-device"/></svg><span id="device-name">请选择下载设备</span><span>⌄</span></button>
      <button class="small" id="directory-button"><svg><use href="#i-folder"/></svg>保存目录</button>
    </div>
    <div class="tabs" role="tablist" aria-label="任务分类">
      <button role="tab" aria-selected="true" data-filter="all" class="active">全部任务 <span id="task-count">0</span></button>
      <button role="tab" aria-selected="false" data-filter="active">下载中</button>
      <button role="tab" aria-selected="false" data-filter="completed">已完成</button>
      <button role="tab" aria-selected="false" data-filter="paused">已暂停</button>
      <button role="tab" aria-selected="false" data-filter="error">下载失败</button>
    </div>
    <div id="notice" class="notice" role="status" hidden></div>
    <section class="task-area" aria-label="下载任务">
      <div class="empty" id="empty-state">
        <svg><use href="#i-download"/></svg>
        <p id="empty-title">登录后使用远程下载</p>
        <span id="empty-detail">登录迅雷账号，选择设备后即可开始下载</span>
        <button class="primary" id="empty-button">登录迅雷账号</button>
      </div>
      <div id="task-list" class="task-list"></div>
      <button id="load-more" class="load-more" hidden>加载更多任务</button>
    </section>
    <footer class="statusbar"><span id="status-text">正在读取登录状态…</span><span id="current-directory"></span></footer>
  </main>

  <dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
    <div class="dialog-header"><h1 id="login-title">迅雷账号登录</h1><button class="close" data-close aria-label="关闭登录">×</button></div>
    <form id="login-form" class="dialog-body">
      <p class="muted">首次使用远程下载，请授权与下载设备绑定的迅雷账号</p>
      <label for="username">账号</label><input id="username" name="username" autocomplete="username" placeholder="手机号 / 邮箱 / 迅雷账号" required maxlength="256">
      <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入迅雷密码" required maxlength="1024">
      <label class="check-label"><input id="remember" type="checkbox">记住密码，用于登录失效后自动重新登录</label>
      <button class="primary full" id="login-submit" type="submit">登录</button>
      <p id="login-message" class="form-message" role="status"></p>
      <a id="verification-link" target="_blank" rel="noopener noreferrer" hidden>打开迅雷验证页面</a>
    </form>
    <form id="review-form" class="review-form" hidden>
      <p>本次登录需要验证手机号 <span id="review-mobile"></span></p>
      <div class="input-row"><input id="sms-code" inputmode="numeric" autocomplete="one-time-code" placeholder="六位短信验证码" aria-label="短信验证码" pattern="[0-9]{6}" maxlength="6" required><button id="send-sms" type="button">获取验证码</button></div>
      <button class="primary full" id="review-submit" type="submit">验证并登录</button>
    </form>
    <div class="dialog-footnote">登录状态仅保存在本机。退出登录后会清除远程登录信息。</div>
  </dialog>

  <dialog id="device-dialog" aria-labelledby="device-title">
    <div class="dialog-header"><h1 id="device-title">选择下载设备</h1><button class="close" data-close aria-label="关闭设备选择">×</button></div>
    <form id="device-form" class="dialog-body">
      <p class="muted">选择账号中与当前部署对应的迅雷设备</p>
      <label for="device-select">下载设备</label><select id="device-select" required></select>
      <p id="device-message" class="form-message" role="status"></p>
      <p class="muted">未找到设备时，请先在原版面板登录迅雷账号，并在迅雷客户端中确认设备已绑定。</p>
      <div class="dialog-actions"><button id="reload-devices" type="button">刷新设备</button><button class="primary" id="device-save" type="submit">确定</button></div>
    </form>
  </dialog>

  <dialog id="folder-dialog" class="wide-dialog" aria-labelledby="folder-title">
    <div class="dialog-header"><h1 id="folder-title">选择下载目录</h1><button class="close" data-close aria-label="关闭目录选择">×</button></div>
    <div class="dialog-body">
      <div class="folder-toolbar"><button id="folder-root">设备目录</button><button id="folder-back" aria-label="返回上级目录">上一级</button><span id="folder-path"></span></div>
      <div id="folders" class="folders" aria-label="设备文件夹"></div>
      <p id="folder-message" class="form-message" role="status"></p>
      <div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" id="folder-select">选择此目录</button></div>
    </div>
  </dialog>

  <dialog id="create-dialog" class="wide-dialog" aria-labelledby="create-title">
    <div class="dialog-header"><h1 id="create-title">新建下载任务</h1><button class="close" data-close aria-label="关闭新建下载">×</button></div>
    <form id="create-form" class="dialog-body">
      <label for="links">下载链接</label><textarea id="links" placeholder="支持磁力链接、迅雷链接和下载直链，每行一条" rows="6" required></textarea>
      <p class="muted compact">每批最多 50 条，任务将逐条提交到 <strong id="create-device"></strong></p>
      <label for="create-directory">保存位置</label><div class="input-row"><input id="create-directory" readonly placeholder="请选择设备上的下载目录"><button type="button" id="create-browse">选择目录</button></div>
      <p id="create-message" class="form-message" role="status"></p>
      <div id="create-results" class="create-results" aria-live="polite"></div>
      <div class="dialog-actions"><button type="button" data-close>关闭</button><button type="submit" class="primary" id="create-submit">立即下载</button></div>
    </form>
  </dialog>
</body>
</html>
